name: webagent-serve

services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python run.py"
    env_file:
      - ./.env
    environment:
      APP_NAME: webagent-backend
      ENV: production
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"
      OPENAI_MODEL: ${OPENAI_MODEL:-nemotron-30b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REQUIRE_AUTH: "false"
      A2A_ENABLED: "true"
      A2A_TRANSPORT_BACKEND: "nats"
      A2A_NATS_URL: "nats://10.0.20.52:4222"
      A2A_DISCOVERY_BASE_URL: "http://a2a-discovery.sprit3dan-labs.net:8080"
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
      - backend_pip_cache:/root/.cache/pip
    ports:
      - "8080:8000"

volumes:
  backend_pip_cache:
